<!--

  Why V32SVGn?
  Image of web contents for lossless offline archives and clean presentation of knowledge, kept on storage mediums in your physical reach - out of hands of central online authorities' manipulation.

  Why not use Hyper Text Markup Language (HTML) or Portable Document Format (PDF)?

  What HTML, PDF and SVG all have in common is JavaScript, which functions with an appropriate interpreter (software). HTML and SVG both have open source code, readable and amendable, while PDF does not.

  But the key paradigm shift enabled by V32SVGn is the following...
  HTML and PDF rely on externally guided data schemas, formatting rules and character encoding & design. In contrast, the V32SVGn project broadens the possibility to upgrade particles of the forementioned codifications by embracing SVG's core - dynamic vector shapes - and by adding components for manageable and trackable innovation and reflection - in p(e)ace of the peer-to-peer way of interaction.

-->
